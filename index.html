<style>
  :root{
    --ink:#1c2a24;
    --paper:#f6f4ee;
    --moss:#3c6255;
    --moss-dark:#2a473d;
    --clay:#b5673a;
    --line:#d9d4c6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia', 'Iowan Old Style', serif;
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:520px;
  }
  h1{
    font-size:1.9rem;
    font-weight:400;
    letter-spacing:-0.01em;
    margin:0 0 4px;
    color:var(--moss-dark);
  }
  .subtitle{
    font-size:0.95rem;
    color:#6b6558;
    margin:0 0 28px;
    font-style:italic;
  }
  label{
    display:block;
    font-size:0.85rem;
    color:#6b6558;
    margin-bottom:6px;
  }
  input[type="text"]{
    width:100%;
    padding:10px 12px;
    font-family:inherit;
    font-size:0.95rem;
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--ink);
    margin-bottom:20px;
  }
  .drop-zone{
    border:2px dashed var(--line);
    border-radius:4px;
    padding:32px 16px;
    text-align:center;
    color:#6b6558;
    margin-bottom:20px;
    background:#fff;
    cursor:pointer;
  }
  .drop-zone.activo{
    border-color:var(--moss);
    background:#f0efe6;
  }
  .drop-zone input{display:none;}
  .archivo-nombre{
    font-size:0.9rem;
    color:var(--moss-dark);
    margin-top:8px;
  }
  button{
    width:100%;
    padding:14px;
    font-family:inherit;
    font-size:1rem;
    border:none;
    border-radius:2px;
    cursor:pointer;
    background:var(--moss);
    color:#fff;
    transition:opacity 0.15s ease;
  }
  button:active{opacity:0.8;}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .status{
    margin-top:16px;
    font-size:0.9rem;
    color:#6b6558;
    min-height:20px;
    line-height:1.5;
  }
  .progreso{
    margin-top:10px;
    height:6px;
    background:var(--line);
    border-radius:3px;
    overflow:hidden;
    display:none;
  }
  .progreso.activo{display:block;}
  .progreso-barra{
    height:100%;
    background:var(--moss);
    width:0%;
    transition:width 0.3s ease;
  }
  .resultado{
    margin-top:24px;
  }
  .resultado textarea{
    width:100%;
    min-height:260px;
    padding:16px;
    font-size:1rem;
    font-family:inherit;
    line-height:1.6;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    resize:vertical;
  }
  .acciones{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .acciones button{
    background:transparent;
    color:var(--moss-dark);
    border:1px solid var(--moss);
  }
  .nota{
    font-size:0.78rem;
    color:#8a8474;
    margin:4px 0 20px;
    line-height:1.4;
  }
</style>
</head>
<body>

    <h1 style="margin:0;">Transcriptor</h1>
  </div>
  <p class="subtitle">Sube una grabación y recibe el texto completo.</p>

  <label for="servidor">URL de tu servidor en Render</label>
  <input type="text" id="servidor" placeholder="https://tu-servicio.onrender.com">
  <p class="nota">La pegas una sola vez, el navegador la recuerda para la próxima.</p>

  <div class="drop-zone" id="drop-zone">
    <span id="drop-texto">Toca aquí para elegir un archivo de audio</span>
    <input type="file" id="archivo" accept="audio/*">
    <div class="archivo-nombre" id="archivo-nombre"></div>
  </div>

  <button id="enviar">Transcribir</button>

  <div class="progreso" id="progreso">
    <div class="progreso-barra" id="progreso-barra"></div>
  </div>
  <p class="status" id="status"></p>

  <div class="resultado" id="resultado" style="display:none;">
    <textarea id="texto-resultado" readonly></textarea>
    <div class="acciones">
      <button id="copiar">Copiar texto</button>
      <button id="descargar">Descargar .txt</button>
    </div>
  </div>
</div>

<script>
const servidorEl = document.getElementById('servidor');
const dropZone = document.getElementById('drop-zone');
const dropTexto = document.getElementById('drop-texto');
const archivoEl = document.getElementById('archivo');
const archivoNombreEl = document.getElementById('archivo-nombre');
const enviarBtn = document.getElementById('enviar');
const statusEl = document.getElementById('status');
const progresoEl = document.getElementById('progreso');
const progresoBarraEl = document.getElementById('progreso-barra');
const resultadoEl = document.getElementById('resultado');
const textoResultadoEl = document.getElementById('texto-resultado');
const copiarBtn = document.getElementById('copiar');
const descargarBtn = document.getElementById('descargar');

// Recordar la URL del servidor entre visitas
const urlGuardada = localStorage.getItem('url_servidor_transcripcion');
if (urlGuardada) servidorEl.value = urlGuardada;
servidorEl.addEventListener('change', () => {
  localStorage.setItem('url_servidor_transcripcion', servidorEl.value.trim());
});

let archivoSeleccionado = null;

dropZone.addEventListener('click', () => archivoEl.click());

archivoEl.addEventListener('change', () => {
  if (archivoEl.files.length > 0) {
    archivoSeleccionado = archivoEl.files[0];
    archivoNombreEl.textContent = archivoSeleccionado.name;
    dropTexto.textContent = 'Archivo listo, toca para cambiarlo';
  }
});

enviarBtn.addEventListener('click', async () => {
  const servidor = servidorEl.value.trim().replace(/\/$/, '');

  if (!servidor) {
    statusEl.textContent = 'Pega la URL de tu servidor primero.';
    return;
  }
  if (!archivoSeleccionado) {
    statusEl.textContent = 'Elige un archivo de audio primero.';
    return;
  }

  enviarBtn.disabled = true;
  resultadoEl.style.display = 'none';
  progresoEl.classList.add('activo');
  progresoBarraEl.style.width = '15%';
  statusEl.textContent = 'Subiendo audio... esto puede tardar varios minutos en audios largos.';

  const formData = new FormData();
  formData.append('audio', archivoSeleccionado);

  try {
    progresoBarraEl.style.width = '40%';

    const resp = await fetch(`${servidor}/transcribir`, {
      method: 'POST',
      body: formData
    });

    progresoBarraEl.style.width = '85%';

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error || ('Código ' + resp.status));
    }

    const data = await resp.json();
    progresoBarraEl.style.width = '100%';

    textoResultadoEl.value = data.texto || '';
    resultadoEl.style.display = 'block';
    statusEl.textContent = `Listo. Se procesó en ${data.partes || 1} parte(s).`;
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    enviarBtn.disabled = false;
    setTimeout(() => {
      progresoEl.classList.remove('activo');
      progresoBarraEl.style.width = '0%';
    }, 800);
  }
});

copiarBtn.addEventListener('click', async () => {
  await navigator.clipboard.writeText(textoResultadoEl.value);
  statusEl.textContent = 'Texto copiado.';
});

descargarBtn.addEventListener('click', () => {
  const blob = new Blob([textoResultadoEl.value], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'transcripcion.txt';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
